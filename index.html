<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main>
    <article data-testid="test-todo-card" class="todo-card" aria-label="Todo task card">

      <div class="card-header">
        <div class="card-title-block">
          <h2 data-testid="test-todo-title" id="todo-title">Redesign the mobile onboarding flow</h2>
          <p data-testid="test-todo-description">
            Update all mobile onboarding screens to match the new brand guidelines
            and improve the step-by-step experience for first-time users.
          </p>
        </div>
        <span data-testid="test-todo-priority" class="priority-badge high" aria-label="Priority: High">High</span>
      </div>

      <div class="card-meta">
        <div class="meta-row">
          <svg class="meta-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="1" y="2" width="14" height="13" rx="2" stroke="#555" stroke-width="1.5"/>
            <path d="M5 1v2M11 1v2M1 6h14" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <time data-testid="test-todo-due-date" datetime="2026-04-18">Due Apr 18, 2026</time>
        </div>

        <div class="meta-row">
          <svg class="meta-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="6.5" stroke="#555" stroke-width="1.5"/>
            <path d="M8 5v3.5l2.5 1.5" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span data-testid="test-todo-time-remaining" id="time-remaining" aria-live="polite">Calculating...</span>
        </div>

        <span data-testid="test-todo-status" id="todo-status" class="status-badge pending" aria-label="Status: Pending">Pending</span>
      </div>

      <div class="card-toggle">
        <label for="todo-checkbox">
          <input
            type="checkbox"
            id="todo-checkbox"
            data-testid="test-todo-complete-toggle"
            aria-label="Mark task as complete"
          />
          Mark as complete
        </label>
      </div>

      <ul data-testid="test-todo-tags" class="tags-list" role="list" aria-label="Task tags">
        <li role="listitem"><span data-testid="test-todo-tag-work" class="tag">Work</span></li>
        <li role="listitem"><span data-testid="test-todo-tag-urgent" class="tag">Urgent</span></li>
        <li role="listitem"><span class="tag">Design</span></li>
      </ul>

      <div class="card-actions">
        <button data-testid="test-todo-edit-button" id="edit-btn" class="btn edit-btn" aria-label="Edit task">
          <svg class="btn-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M11.5 2.5l2 2L5 13H3v-2L11.5 2.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          Edit
        </button>
        <button data-testid="test-todo-delete-button" class="btn delete-btn" aria-label="Delete task">
          <svg class="btn-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 4h12M6 4V2h4v2M5 4l.5 9h5L11 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Delete
        </button>
      </div>

    </article>

  </main>

  <script src="script.js"></script>
</body>
</html>
